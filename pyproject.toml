[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gz-release-dashboard"
version = "0.1.0"
description = "Dashboard of Gazebo library versions across every packaging system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Jose Luis Rivero", email = "jrivero@honurobotics.com" }]
dependencies = [
    "requests",
    "PyYAML",
    "rich",
    "jinja2",
    "click",
]

[project.scripts]
gz-dashboard = "gz_release_dashboard.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/gz_release_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
